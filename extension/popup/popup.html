<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">IT</div>
        <div class="brand-text">
          <div class="brand-title">Image Translator</div>
          <div class="brand-subtitle">Scan or click to translate</div>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <button class="btn btn-primary" id="scanPage-Id">Scan all images</button>
        <button class="btn btn-accent" id="clickMode-Id">Click to translate</button>
      </div>

      <div class="field">
        <label class="field-label" for="language-Id">Target language</label>
        <select id="language-Id" class="select">
          <option value="en" selected>English</option>
          <option value="vi">Vietnamese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="pt">Portuguese</option>
          <option value="it">Italian</option>
          <option value="ru">Russian</option>
          <option value="id">Indonesian</option>
        </select>
      </div>

      <div class="hint" id="status-Id" role="status">Ready.</div>
    </section>

    <section class="card card-muted">
      <div class="card-header">
        <div class="card-title">Server</div>
      </div>
      <div class="field">
        <label class="field-label" for="serverUrl-Id">Server URL</label>
        <input id="serverUrl-Id" class="input" type="text" placeholder="http://localhost:3000" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label class="field-label" for="apiToken-Id">API token</label>
        <input id="apiToken-Id" class="input" type="password" placeholder="TRANSLATOR_API_KEY from the server's .env" autocomplete="off" spellcheck="false" />
      </div>
      <div class="row">
        <button class="btn btn-secondary" id="saveServer-Id">Save</button>
        <button class="btn btn-secondary" id="testServer-Id">Test connection</button>
      </div>
      <div class="hint" id="serverStatus-Id" role="status"></div>
    </section>
  </div>
  <script src="popup-main.js"></script>
</body>
</html>
